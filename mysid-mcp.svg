<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Deep Water / Bioluminescent Background Gradients -->
    <radialGradient id="oceanBg" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#122c42" />
      <stop offset="45%" stop-color="#081726" />
      <stop offset="85%" stop-color="#030a12" />
      <stop offset="100%" stop-color="#010408" />
    </radialGradient>

    <radialGradient id="causticGlow" cx="40%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#006699" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Translucent Chitin / Glass Body Gradient -->
    <linearGradient id="chitinGlass" x1="0%" y1="0%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="15%" stop-color="#c9f1f7" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#80deea" stop-opacity="0.22" />
      <stop offset="75%" stop-color="#26c6da" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00838f" stop-opacity="0.6" />
    </linearGradient>

    <!-- Natural Internal Organs Gradient (Golden Amber / Hepatopancreas) -->
    <linearGradient id="visceraAmber" x1="10%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#ffe082" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#ffb74d" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#f57c00" stop-opacity="0.8" />
      <stop offset="90%" stop-color="#bf360c" stop-opacity="0.65" />
    </linearGradient>

    <!-- Compound Eye Spherical Shading (Glossy Ommatidia) -->
    <radialGradient id="eyeFacingViewer" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#4a6572" />
      <stop offset="35%" stop-color="#212c37" />
      <stop offset="75%" stop-color="#0a1017" />
      <stop offset="95%" stop-color="#00f2fe" stop-opacity="0.45" />
    </radialGradient>

    <radialGradient id="eyeFar" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#37474f" />
      <stop offset="50%" stop-color="#182228" />
      <stop offset="100%" stop-color="#050a0d" />
    </radialGradient>

    <!-- Statocyst (Mysid Equilibrium Organ) Gradient -->
    <radialGradient id="statocystCore" cx="42%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#ffe57f" />
      <stop offset="75%" stop-color="#ff8f00" />
      <stop offset="100%" stop-color="#263238" />
    </radialGradient>

    <!-- Lighting Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badgeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Continuous Smooth Squircle (Curvature: r=185 on 800x800 canvas) -->
  <rect width="800" height="800" rx="185" fill="url(#oceanBg)" />
  <!-- Inner Ambient Water Depth Glow -->
  <rect width="800" height="800" rx="185" fill="url(#causticGlow)" />
  <rect width="794" height="794" x="3" y="3" rx="182" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- MCP Schematic Backdrop Ring -->
  <g opacity="0.22" stroke="#00e5ff" fill="none">
    <circle cx="400" cy="385" r="320" stroke-width="1.5" stroke-dasharray="12 18 45 12" />
    <circle cx="400" cy="385" r="300" stroke-width="0.8" stroke-dasharray="6 8" />
    <circle cx="400" cy="385" r="340" stroke-width="0.5" stroke-dasharray="80 120" />
  </g>

  <!-- Mysid Shrimp Facing Foreground (Eyes oriented front/this side) -->
  <g id="realistic-mysid" transform="translate(18, -10)">

    <!-- Distant Antennae (Background Layer) -->
    <g fill="none" stroke-linecap="round" opacity="0.45">
      <path d="M 230 315 C 170 210, 260 90, 480 85 C 590 80, 680 120, 720 150" stroke="#00bcd4" stroke-width="2" />
      <path d="M 215 328 C 140 250, 190 145, 380 125 C 510 110, 610 150, 665 190" stroke="#80deea" stroke-width="1.2" />
    </g>

    <!-- Far Swimmerets & Exopodites (Depth Layer) -->
    <g stroke="#4dd0e1" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4">
      <path d="M 330 425 Q 355 490 395 530" />
      <path d="M 370 420 Q 395 485 440 520" />
      <path d="M 405 410 Q 435 475 480 510" />
      <path d="M 440 395 Q 475 455 525 485" />
      <path d="M 495 375 Q 525 430 570 455" />
      <path d="M 545 350 Q 575 400 615 425" />
    </g>

    <!-- Near Thoracic Legs & Biramous Exopods (Realistic Segments) -->
    <g stroke-linecap="round" fill="none">
      <!-- Exopodites (Feathered swimming branches) -->
      <g stroke="#b2ebf2" stroke-width="1.6" opacity="0.75">
        <path d="M 305 428 Q 285 495 320 545" />
        <path d="M 335 425 Q 320 495 360 550" />
        <path d="M 365 420 Q 355 495 405 545" />
        <path d="M 400 410 Q 405 485 455 530" />
        <path d="M 430 400 Q 445 470 495 515" />
      </g>
      <!-- Endopodites (Segmented inner legs reaching down/forward) -->
      <g stroke="#e0f7fa" stroke-width="2.2" opacity="0.85">
        <path d="M 270 420 L 240 465 L 255 510 L 275 525" />
        <path d="M 295 420 L 270 470 L 288 518 L 308 535" />
        <path d="M 325 418 L 305 470 L 325 520 L 348 535" />
        <path d="M 355 412 L 340 465 L 365 512 L 390 528" />
        <path d="M 385 405 L 380 455 L 410 498 L 435 512" />
      </g>
      <!-- Fine leg setules (micro-hairs) -->
      <g stroke="#80deea" stroke-width="0.8" opacity="0.5">
        <path d="M 242 468 L 235 475 M 248 485 L 240 492 M 253 502 L 246 510" />
        <path d="M 272 473 L 265 480 M 279 490 L 271 498 M 285 508 L 277 516" />
        <path d="M 307 475 L 300 482 M 315 492 L 308 500 M 322 510 L 314 518" />
      </g>
    </g>

    <!-- INTERNAL VISCERA & HEPATOPANCREAS (Visible through transparent cuticle) -->
    <g filter="url(#softGlow)">
      <!-- Main Gastric / Hepatic Organ Mass -->
      <path d="M 265 370 C 275 330, 360 318, 410 340 C 400 375, 360 405, 295 398 C 275 395, 260 385, 265 370 Z" 
            fill="url(#visceraAmber)" />
      <!-- Secondary Digestive Lobe -->
      <ellipse cx="330" cy="355" rx="35" ry="16" fill="#ff7043" opacity="0.75" transform="rotate(-6, 330, 355)" />
      <!-- Heart & Dorsal Arterial Channel -->
      <ellipse cx="365" cy="336" rx="30" ry="8" fill="#ffe082" opacity="0.8" transform="rotate(4, 365, 336)" />
      <!-- Intestinal Tract running along curved abdominal somites -->
      <path d="M 400 348 Q 470 345 540 325 T 675 255" 
            fill="none" stroke="#f4511e" stroke-width="3" stroke-dasharray="12 4" opacity="0.8" />
    </g>

    <!-- Natural Star Chromatophores (Pigment Cells) -->
    <g fill="#bf360c" opacity="0.8">
      <circle cx="285" cy="352" r="2.5" /><circle cx="315" cy="335" r="2" /><circle cx="340" cy="368" r="3" />
      <circle cx="380" cy="358" r="2.2" /><circle cx="435" cy="342" r="2.5" /><circle cx="475" cy="330" r="2" />
      <circle cx="520" cy="310" r="2.5" /><circle cx="568" cy="288" r="2" /><circle cx="615" cy="265" r="2.2" />
      <circle cx="660" cy="242" r="1.8" />
    </g>

    <!-- ABDOMINAL SOMITES (Segments 1 to 6) Overlapping Glass Arcs -->
    <!-- Segment 1 -->
    <path d="M 395 320 C 435 305, 468 312, 478 340 C 470 372, 435 388, 400 382 C 385 358, 385 335, 395 320 Z" 
          fill="url(#chitinGlass)" stroke="#e0f7fa" stroke-width="1.8" />
    <!-- Segment 2 -->
    <path d="M 462 310 C 495 295, 525 300, 535 325 C 525 354, 492 365, 460 358 Z" 
          fill="url(#chitinGlass)" stroke="#e0f7fa" stroke-width="1.8" />
    <!-- Segment 3 (Arch Apex) -->
    <path d="M 520 295 C 550 282, 578 288, 588 310 C 578 335, 548 344, 518 338 Z" 
          fill="url(#chitinGlass)" stroke="#e0f7fa" stroke-width="1.8" />
    <!-- Segment 4 -->
    <path d="M 572 280 C 600 268, 625 272, 635 292 C 622 314, 595 322, 568 318 Z" 
          fill="url(#chitinGlass)" stroke="#e0f7fa" stroke-width="1.8" />
    <!-- Segment 5 -->
    <path d="M 618 262 C 645 250, 668 255, 678 272 C 665 292, 640 300, 612 295 Z" 
          fill="url(#chitinGlass)" stroke="#e0f7fa" stroke-width="1.8" />
    <!-- Segment 6 (Long Somite) -->
    <path d="M 658 245 C 690 230, 712 235, 722 252 C 710 272, 682 280, 652 275 Z" 
          fill="url(#chitinGlass)" stroke="#e0f7fa" stroke-width="1.8" />

    <!-- CEPHALOTHORAX / CARAPACE (Front Shell & Rostrum) -->
    <path d="M 235 348 C 220 320, 250 295, 305 292 C 380 288, 415 305, 425 335 C 430 375, 385 412, 305 418 C 250 422, 235 385, 235 348 Z" 
          fill="url(#chitinGlass)" stroke="#ffffff" stroke-width="2.2" />

    <!-- Sharp Rostrum (Snout) -->
    <path d="M 250 320 L 185 330 L 238 345 Z" fill="url(#chitinGlass)" stroke="#e0f7fa" stroke-width="1.2" />

    <!-- Edge Specular Lustre & Chitin Reflection Highlights -->
    <path d="M 255 310 C 300 296, 385 292, 420 318" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85" />
    <path d="M 260 412 C 315 416, 375 405, 410 380" fill="none" stroke="#80deea" stroke-width="1.6" opacity="0.6" />
    <path d="M 470 308 C 500 295, 545 285, 590 280" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75" />

    <!-- TAIL FAN: UROPODS, TELSON & STATOCYST -->
    <g id="tail-fan">
      <!-- Far Uropods -->
      <path d="M 715 242 C 748 222, 782 228, 800 242 C 778 258, 742 260, 712 250 Z" fill="url(#chitinGlass)" stroke="#80deea" stroke-width="1.2" opacity="0.7" />
      <!-- Central Telson Spike -->
      <path d="M 718 248 L 782 265 L 775 272 L 712 255 Z" fill="url(#chitinGlass)" stroke="#00bcd4" stroke-width="1.2" />
      <!-- Near Uropod with STATOCYST (Key Mysida Identifier) -->
      <path d="M 716 250 C 748 238, 780 245, 792 264 C 762 275, 735 272, 712 258 Z" fill="url(#chitinGlass)" stroke="#ffffff" stroke-width="1.6" />
      
      <!-- Diagnostic Statocyst Unit (Spherical organ with fluid vesicle & statolith core) -->
      <g filter="url(#softGlow)">
        <circle cx="732" cy="252" r="8" fill="#041829" stroke="#00f2fe" stroke-width="1.8" />
        <circle cx="732" cy="252" r="4.5" fill="url(#statocystCore)" />
        <circle cx="730.5" cy="250.5" r="1.6" fill="#ffffff" />
      </g>
    </g>

    <!-- COMPOUND STALKED EYES (ANGLED FORWARD / FACING VIEWER) -->
    <g id="eyes-facing-viewer">
      <!-- 1. Background Eye (Far eye slightly visible beyond rostrum) -->
      <g opacity="0.85">
        <path d="M 230 322 L 205 298 L 220 288 L 242 312 Z" fill="#80deea" stroke="#00acc1" stroke-width="1.2" />
        <ellipse cx="205" cy="292" rx="17" ry="15" fill="url(#eyeFar)" stroke="#00e5ff" stroke-width="1.2" />
        <circle cx="199" cy="286" r="3.5" fill="#ffffff" opacity="0.8" />
      </g>

      <!-- 2. Foreground Eye (Prominent, glossy, looking directly at "this side" / viewer) -->
      <g id="foreground-eye">
        <!-- Muscular Eye Stalk -->
        <path d="M 252 346 L 220 322 L 236 308 L 265 332 Z" fill="#b2ebf2" stroke="#e0f7fa" stroke-width="1.5" />
        <!-- Big Spherical Compound Bulb -->
        <ellipse cx="225" cy="318" rx="26" ry="24" fill="url(#eyeFacingViewer)" stroke="#00f2fe" stroke-width="2" filter="url(#softGlow)" />
        <!-- Ommatidia Hex Micro-Sheen Arc -->
        <path d="M 207 312 C 210 300, 222 296, 235 298" fill="none" stroke="#80deea" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.75" />
        <!-- Primary Specular Glares (Giving lively, clear glassy gaze) -->
        <ellipse cx="214" cy="308" rx="8" ry="5.5" fill="#ffffff" opacity="0.95" transform="rotate(-15, 214, 308)" />
        <circle cx="233" cy="326" r="3" fill="#ffffff" opacity="0.65" />
        <path d="M 210 325 C 215 334, 225 338, 236 335" fill="none" stroke="#00f2fe" stroke-width="1.4" opacity="0.6" />
      </g>
    </g>

    <!-- Foreground Sensory Antennae & Scale (Sweeping Toward Viewer) -->
    <g fill="none" stroke-linecap="round">
      <!-- Antennal Scale (Scaphocerite blade below eye) -->
      <path d="M 225 352 Q 165 365 125 400 Q 175 388 218 365 Z" fill="#bbf2f6" fill-opacity="0.4" stroke="#ffffff" stroke-width="1.4" />
      <!-- Long Whiskers sweeping back across the screen -->
      <path d="M 245 336 C 180 230, 270 100, 520 85 C 645 78, 730 120, 770 155" 
            stroke="#00f2fe" stroke-width="2.8" opacity="0.75" filter="url(#softGlow)" />
      <path d="M 245 336 C 180 230, 270 100, 520 85 C 645 78, 730 120, 770 155" 
            stroke="#ffffff" stroke-width="1.2" opacity="0.95" />
      <!-- Secondary Ventral Whiskers -->
      <path d="M 235 358 C 130 290, 185 160, 410 135 C 560 118, 665 165, 725 210" 
            stroke="#4facfe" stroke-width="2.2" opacity="0.6" />
      <!-- Front sensing antennules -->
      <path d="M 195 342 C 125 350, 75 380, 30 425" stroke="#e0f7fa" stroke-width="2" opacity="0.8" />
      <path d="M 190 355 C 130 380, 85 425, 55 475" stroke="#80deea" stroke-width="1.5" opacity="0.6" />
    </g>

  </g>

  <!-- REPO BRANDING: MYSID MCP (Clean, Modern Protocol Styling) -->
  <g transform="translate(400, 680)">
    <!-- Circuit Data Node Accents -->
    <path d="M -180 -42 L -115 -42 L -75 -15" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.45" />
    <circle cx="-180" cy="-42" r="3.5" fill="#00f2fe" opacity="0.8" />
    <path d="M 180 -42 L 115 -42 L 75 -15" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.45" />
    <circle cx="180" cy="-42" r="3.5" fill="#00f2fe" opacity="0.8" />

    <!-- "MYSID" Header -->
    <text x="0" y="-10" 
          text-anchor="middle" 
          fill="#ffffff" 
          font-family="system-ui, -apple-system, 'SF Pro Display', Roboto, 'Segoe UI', sans-serif" 
          font-size="36" 
          font-weight="800" 
          letter-spacing="10">MYSID</text>

    <!-- "MCP" Sub-Badge -->
    <g transform="translate(0, 26)">
      <rect x="-95" y="-18" width="190" height="30" rx="15" 
            fill="#051c2e" stroke="#00f2fe" stroke-width="1.4" filter="url(#badgeGlow)" />
      <text x="0" y="2" 
            text-anchor="middle" 
            fill="#00f2fe" 
            font-family="system-ui, -apple-system, 'SF Mono', 'Fira Code', monospace" 
            font-size="13" 
            font-weight="700" 
            letter-spacing="4">MCP SERVER</text>
    </g>
  </g>

  <!-- Natural Bioluminescent Microplankton in Water Column -->
  <g fill="#00f2fe" opacity="0.5" filter="url(#softGlow)">
    <circle cx="120" cy="210" r="1.8" />
    <circle cx="160" cy="580" r="2.2" opacity="0.3" />
    <circle cx="260" cy="160" r="1.5" />
    <circle cx="680" cy="180" r="2" />
    <circle cx="710" cy="490" r="1.5" opacity="0.35" />
    <circle cx="620" cy="610" r="2.5" opacity="0.4" />
  </g>
</svg>
