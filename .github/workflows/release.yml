name: Build & Release mysid

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'rust-mcp/**'
      - 'package-portable.ps1'
      - 'install.ps1'
      - 'install.sh'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-mcp -> target

      - name: Compile mysid Release Binary
        run: |
          cd rust-mcp
          cargo build --release
        shell: bash

      - name: Package Portable Bundle & Archive
        run: |
          powershell -ExecutionPolicy Bypass -File .\package-portable.ps1 -SkipBuild
        shell: pwsh

      - name: Collect release files
        run: |
          New-Item -ItemType Directory -Path out | Out-Null
          Copy-Item dist/mysid-windows-x64.zip out/
          Copy-Item rust-mcp/target/release/mysid.exe out/
        shell: pwsh

      - name: Upload Windows files
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  build-unix:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, asset: mysid-linux-x64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, asset: mysid-linux-arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: mysid-macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: mysid-macos-x64 }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-mcp -> target
          key: ${{ matrix.target }}

      - name: Compile mysid Release Binary
        run: |
          cd rust-mcp
          cargo build --release --target ${{ matrix.target }}
        shell: bash

      - name: Check that it runs
        # The x86_64 macOS build runs on the arm64 runner through Rosetta.
        run: |
          ./rust-mcp/target/${{ matrix.target }}/release/mysid help | head -3
        shell: bash

      - name: Collect release file
        run: |
          mkdir -p out
          cp rust-mcp/target/${{ matrix.target }}/release/mysid out/${{ matrix.asset }}
          chmod +x out/${{ matrix.asset }}
        shell: bash

      - name: Upload ${{ matrix.asset }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

  publish:
    name: Publish rolling release
    needs: [build-windows, build-unix]
    # Windows is published even when a Linux or macOS build fails; those files are added when they built.
    if: ${{ always() && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download build files
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish / Update Rolling Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "mysid (Latest Build)"
          body: |
            ## Codebase intelligence for LLM agents: one binary, command line and MCP server

            ### Install
            - **Windows (PowerShell):** `Invoke-WebRequest https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 -OutFile install.ps1; powershell -ExecutionPolicy Bypass -File .\install.ps1 -Download`
            - **macOS / Linux:** `curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh`

            ### Direct downloads
            - Windows: `mysid.exe`, or the portable bundle `mysid-windows-x64.zip`
            - Linux: `mysid-linux-x64`, `mysid-linux-arm64`
            - macOS: `mysid-macos-arm64` (Apple Silicon), `mysid-macos-x64` (Intel)
            - `SHA256SUMS` lists the checksum of every file.
          draft: false
          prerelease: false
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
