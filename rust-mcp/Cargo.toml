[package]
name = "mysid"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "High-performance standalone codebase intelligence and MCP tool server"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
regex-syntax = "0.8"
png = "0.17"
ignore = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
